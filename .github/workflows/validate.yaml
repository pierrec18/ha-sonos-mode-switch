name: Home Assistant
on:
  push:
    paths: ['custom_components/**', 'tests_ha/**', 'scripts/test_homeassistant.py', 'requirements-ha-test.txt', 'hacs.json', '.github/workflows/validate.yaml']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install -r requirements-ha-test.txt
      # The full fixture plugin targets older Core. Only its standalone HTTP mock
      # is reused; tests bootstrap the actual target Core without compatibility shims.
      - run: pip install --no-deps pytest-homeassistant-custom-component==0.13.375
      - run: ruff check --target-version py314 custom_components tests_ha scripts/test_homeassistant.py
      - run: ruff format --check custom_components tests_ha scripts/test_homeassistant.py
      - run: python -m compileall -q custom_components
      - run: python scripts/test_homeassistant.py
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          github_token: ${{ secrets.GITHUB_TOKEN }}
          ignore: brands
